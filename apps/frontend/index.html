<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fonts first, and from HERE rather than from an @import at the top of src/index.css.
         Inside the stylesheet the request is invisible to the preload scanner and is only made
         after the whole CSS bundle has downloaded and parsed, which puts two cold origins in
         series behind it and holds first paint on all four trips. Here both are found in the
         first bytes of the document and the handshakes overlap the app CSS download.

         ONLY the Latin faces are here. The Chinese ones are requested by src/cjkFont.ts when the
         visitor is actually reading Chinese — unconditionally they were the largest single layout
         shift on the page, because a Latin page still reaches a CJK face for the odd glyph its own
         faces lack and every one of those re-measures when the font lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The plain-text summary of the site for LLM crawlers (llmstxt.org). Site-wide and true of
         every route, which is why it belongs in the shell rather than in a per-route head. A file
         nothing points at is a file an agent has to guess the path of. -->
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
    <meta name="theme-color" content="#7A1028" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TinyOrder — Start Your Own Food Shop, Orders in One Place</title>
    <meta name="description" content="Start your own food shop online and keep every order in one place. TinyOrder takes orders for home kitchens, bakers, makers and small sellers. Free 7 days." />
    <!-- Link previews on Instagram / WhatsApp / Facebook.
         og:image must be absolute — most scrapers silently drop relative
         URLs. No og:url: this file is the SHELL every non-landing route
         is served from (vercel.json rewrites to app.html, which is a copy
         of it), so a hardcoded URL here would be wrong on every route
         except the homepage — notably /s/:slug shop links. Without the
         tag, scrapers fall back to the fetched URL.

         The <link rel="canonical"> that search engines want has the same
         problem and cannot live here either — it is written per route at
         runtime instead (src/canonical.ts), which works for Google
         because it renders the page and would NOT work here, because
         link-preview scrapers do not run JavaScript. Same reason the
         Schema.org JSON-LD is injected by the landing route rather than
         parked in this file: it would otherwise describe every page.
         See src/marketing/structuredData.ts.

         The homepage is the exception, and gets BOTH tags: the build
         prerenders `/` over dist/index.html, which Vercel serves for
         that one path, so scripts/prerender.tsx writes a canonical and
         an og:url naming the homepage into the copy nothing else uses.
         Do not move them up here — here they would name every route. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TinyOrder" />
    <meta property="og:title" content="TinyOrder — Start Your Own Food Shop, Orders in One Place" />
    <meta property="og:description" content="Start your own food shop online and keep every order in one place. TinyOrder takes orders for home kitchens, bakers, makers and small sellers. Free 7 days." />
    <meta property="og:image" content="https://tinyorder.shop/og-cover.jpg" />
    <!-- Declared dimensions let a scraper reserve the card's space before the
         image itself has finished downloading. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="A printed receipt reading: Sell what you make online — without the DM chaos. One storefront link, every order in one place, bilingual. Total: 7 days free." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Not the <title>'s twin, unlike og:title. This string sits directly above the share card,
         which no longer says "food" — a card reading "Sell what you make online" under a title
         reading "Sell your food online" contradicts itself in the one place both are visible at
         once. Nothing indexes this tag, so aligning it costs no keyword. -->
    <meta name="twitter:title" content="TinyOrder — Sell what you make online" />
    <meta name="twitter:description" content="One branded storefront link for home kitchens, bakers, makers and small sellers — every order in one place." />
    <meta name="twitter:image" content="https://tinyorder.shop/og-cover.jpg" />
    <meta name="twitter:image:alt" content="A printed receipt reading: Sell what you make online — without the DM chaos. One storefront link, every order in one place, bilingual. Total: 7 days free." />
    <!-- WHO THIS SITE IS. Static, and deliberately so: the rest of the app's structured data is
         injected by the route that owns it (src/marketing/structuredData.ts), but a crawler that
         does not execute JavaScript — which is most of the LLM ones — sees none of that, and
         "who publishes this" is the one question they must be able to answer without running the
         app. It is also the one block that stays TRUE ON EVERY ROUTE, which is what makes it safe
         in a file that vercel.json serves for every path.

         The host is hardcoded because a static asset cannot read one; it must match SITE_URL in
         src/site.ts, the og:image tags above and public/sitemap.xml. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tinyorder.shop/#organization",
            "name": "TinyOrder",
            "url": "https://tinyorder.shop/",
            "description": "An online ordering page for home kitchens, bakers, makers and small independent sellers: one branded storefront link, a product list you control, delivery fees by region or distance, and every order in one place.",
            "logo": {
              "@type": "ImageObject",
              "url": "https://tinyorder.shop/android-chrome-512x512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://tinyorder.shop/#website",
            "url": "https://tinyorder.shop/",
            "name": "TinyOrder",
            "publisher": { "@id": "https://tinyorder.shop/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://tinyorder.shop/#app",
            "name": "TinyOrder",
            "url": "https://tinyorder.shop/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://tinyorder.shop/#organization" }
          }
        ]
      }
    </script>
    <script>window.praxor=window.praxor||function(){(window.praxor.q=window.praxor.q||[]).push(arguments)};window.praxor.id=window.praxor.id||function(){try{return sessionStorage.getItem("praxor_vid")}catch(e){return null}}</script>
    <script defer src="https://api-production-cd12.up.railway.app/analytics/track.js" data-site-id="96b4b6ce-2e53-4889-83dc-b8065145d5aa"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
